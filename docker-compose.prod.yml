services:
  nginx:
    image: nginx:alpine
    container_name: enterprise_chat_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - web

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: enterprise_chat_server
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-chat_admin}:${POSTGRES_PASSWORD:-chat_secret_password}@postgres:5432/${POSTGRES_DB:-enterprise_chat}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_secret_key}
      S3_BUCKET_NAME: enterprise-chat-files
      JWT_SECRET: ${JWT_SECRET:-enterprise_prod_jwt_secret_change_me_immediately!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-enterprise_prod_refresh_secret_change_me!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: enterprise_chat_web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_WS_URL: /chat

  postgres:
    image: postgres:16-alpine
    container_name: enterprise_chat_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_chat}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat_admin} -d ${POSTGRES_DB:-enterprise_chat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enterprise_chat_redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: pgsty/silo:latest
    container_name: enterprise_chat_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_key}
    volumes:
      - minio_prod_data:/data

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
