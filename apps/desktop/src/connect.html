<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cài đặt kết nối - Enterprise Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #020617;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .logo-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
    }
    .logo-container img {
      width: 52px;
      height: 52px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 16px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    .hint {
      font-size: 11px;
      color: #64748b;
      margin-top: 6px;
    }
    .hint code {
      background-color: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
      font-family: monospace;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="icon.png" alt="Logo">
    </div>
    <h1>Kết nối Máy chủ Enterprise Chat</h1>
    <p class="subtitle">Ứng dụng chưa kết nối được đến máy chủ nội bộ. Vui lòng kiểm tra địa chỉ máy chủ hoặc IP mạng LAN.</p>

    <div class="error-badge">
      <span>⚠️ Không tìm thấy dịch vụ máy chủ</span>
    </div>

    <form id="connectForm">
      <div class="form-group">
        <label for="serverUrl">Địa chỉ máy chủ Web (LAN IP / Domain):</label>
        <input type="text" id="serverUrl" placeholder="http://10.2.8.231:3000" required>
        <p class="hint">Gợi ý địa chỉ máy chủ dev nội bộ: <code>http://10.2.8.231:3000</code></p>
      </div>
      <button type="submit" class="btn" id="connectBtn">Lưu & Kết nối lại</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('connectForm');
    const input = document.getElementById('serverUrl');
    const btn = document.getElementById('connectBtn');

    // Ask electron for current saved URL
    if (window.electronAPI && window.electronAPI.getServerUrl) {
      window.electronAPI.getServerUrl().then((saved) => {
        if (saved) input.value = saved;
      });
    }

    if (!input.value) {
      input.value = 'http://10.2.8.231:3000';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let url = input.value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'http://' + url;
      }
      btn.innerText = 'Đang thử kết nối...';
      btn.disabled = true;

      if (window.electronAPI && window.electronAPI.setServerUrl) {
        window.electronAPI.setServerUrl(url);
      } else {
        window.location.href = url;
      }
    });
  </script>
</body>
</html>
